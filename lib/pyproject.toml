[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-cost-explorer-connector"
version = "1.0.0"
description = "Conector Ruvic de consulta de costos y uso de AWS (Cost Explorer)"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34,<2.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_cost_explorer_connector*"]
